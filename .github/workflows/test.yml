name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: 1.22

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

  js-syntax-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    # The built-in page scripts are shipped as embedded .js files
    # (internal/ui/**). node --check parses each without executing —
    # catches syntax regressions that go vet/test cannot see.
    - name: Syntax-check embedded page scripts
      run: |
        set -e
        find internal/ui -name '*.js' -print0 | while IFS= read -r -d '' f; do
          echo "checking $f"
          node --check "$f"
        done

  race-detection:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: 1.22

    - name: Test with Race Detector
      env:
        CGO_ENABLED: 1
      run: go test -race -v -count=5 ./utils/...
