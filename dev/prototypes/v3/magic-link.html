<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | dracory/auth</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="min-vh-100 d-flex align-items-center justify-content-center py-5">
<div class="container"><div class="row justify-content-center"><div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

<h1 class="h3 fw-bold mb-1">Login to your account</h1>
<p class="text-muted mb-4">We'll email you a secure link to log in instantly — no password needed.</p>
<div class="card shadow-sm"><div class="card-body p-4">
<form>
<div class="mb-3"><label class="form-label small fw-bold text-uppercase text-secondary" for="email">Email</label><input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="you@example.com" autocomplete="username" required></div>
<button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mt-2"><i class="bi bi-envelope me-2"></i>Send me a quick login link</button>
<div class="d-flex align-items-center gap-3 my-4 text-secondary small text-uppercase"><div class="flex-grow-1 border-top"></div><span>or</span><div class="flex-grow-1 border-top"></div></div>
<a class="btn btn-outline-secondary btn-lg w-100 fw-bold" href="login.html"><i class="bi bi-key me-2"></i>Use password instead</a>
</form>
</div></div>
<div class="text-muted small text-center mt-4">Don&#39;t have an account? <a class="fw-bold text-decoration-none" href="register.html">Register</a></div>

</div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
