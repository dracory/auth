<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create your account | dracory/auth</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="min-vh-100 d-flex align-items-center justify-content-center py-5">
<div class="container"><div class="row justify-content-center"><div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

<h1 class="h3 fw-bold mb-1">Create your account</h1>
<p class="text-muted mb-4">A few details and you're in.</p>
<div class="card shadow-sm"><div class="card-body p-4">
<form>
<div class="row g-3 mb-1">
<div class="col-6"><div class="mb-0"><label class="form-label small fw-bold text-uppercase text-secondary" for="first_name">First name</label><input type="text" class="form-control form-control-lg" id="first_name" name="first_name" placeholder="Your first name" required></div></div>
<div class="col-6"><div class="mb-0"><label class="form-label small fw-bold text-uppercase text-secondary" for="last_name">Last name</label><input type="text" class="form-control form-control-lg" id="last_name" name="last_name" placeholder="Your last name" required></div></div>
</div>
<div class="mt-3"></div>
<div class="mb-3"><label class="form-label small fw-bold text-uppercase text-secondary" for="email">Email</label><input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="you@example.com" autocomplete="username" required></div>
<div class="mb-3"><label class="form-label small fw-bold text-uppercase text-secondary" for="password">Password</label><input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Min 8 characters" autocomplete="new-password" required></div>
<div class="mb-3"><label class="form-label small fw-bold text-uppercase text-secondary" for="password_confirm">Confirm password</label><input type="password" class="form-control form-control-lg" id="password_confirm" name="password_confirm" placeholder="Repeat password" autocomplete="new-password" required></div>
<button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mt-2"><i class="bi bi-person-plus me-2"></i>Create account</button>
</form>
</div></div>
<div class="text-muted small text-center mt-4">Already have an account? <a class="fw-bold text-decoration-none" href="login.html">Login</a></div>

</div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
