<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot your password? | dracory/auth</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="min-vh-100 d-flex align-items-center justify-content-center py-5">
<div class="container"><div class="row justify-content-center"><div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

<h1 class="h3 fw-bold mb-1">Forgot your password?</h1>
<p class="text-muted mb-4">Enter your email and we'll send you a reset link.</p>
<div class="card shadow-sm"><div class="card-body p-4">
<form>
<div class="mb-3"><label class="form-label small fw-bold text-uppercase text-secondary" for="email">Email</label><input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="you@example.com" autocomplete="username" required></div>
<button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mt-2"><i class="bi bi-envelope me-2"></i>Send reset link</button>
</form>
</div></div>
<div class="text-muted small text-center mt-4">Remembered it? <a class="fw-bold text-decoration-none" href="login.html">Login</a></div>

</div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
