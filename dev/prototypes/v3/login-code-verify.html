<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check your email | dracory/auth</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<body class="bg-light">
<div class="min-vh-100 d-flex align-items-center justify-content-center py-5">
<div class="container"><div class="row justify-content-center"><div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

<h1 class="h3 fw-bold mb-1">Check your email</h1>
<p class="text-muted mb-4">We sent a 6-digit code to <strong>you@example.com</strong>. Enter it below to sign in.</p>
<div class="card shadow-sm"><div class="card-body p-4">
<form>
<div class="row g-2 justify-content-center mb-4"><div class="col"><input class="form-control form-control-lg text-center fw-bold" maxlength="1" inputmode="numeric" autocomplete="one-time-code"></div><div class="col"><input class="form-control form-control-lg text-center fw-bold" maxlength="1" inputmode="numeric" autocomplete="one-time-code"></div><div class="col"><input class="form-control form-control-lg text-center fw-bold" maxlength="1" inputmode="numeric" autocomplete="one-time-code"></div><div class="col"><input class="form-control form-control-lg text-center fw-bold" maxlength="1" inputmode="numeric" autocomplete="one-time-code"></div><div class="col"><input class="form-control form-control-lg text-center fw-bold" maxlength="1" inputmode="numeric" autocomplete="one-time-code"></div><div class="col"><input class="form-control form-control-lg text-center fw-bold" maxlength="1" inputmode="numeric" autocomplete="one-time-code"></div></div>
<input type="hidden" name="verification_code">
<button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mt-2"><i class="bi bi-check2-circle me-2"></i>Verify code</button>
</form>
</div></div>
<div class="text-muted small text-center mt-4">Didn&#39;t get a code? <a class="fw-bold text-decoration-none" href="otp.html">Resend</a></div>

</div></div></div>
</div>
