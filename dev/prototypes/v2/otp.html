<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | dracory/auth</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
body{background:#f6f7f9;min-height:100vh;display:flex;flex-direction:column}
.auth-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:3rem 1rem}
.auth-box{width:100%;max-width:420px}
.auth-title{font-weight:800;letter-spacing:-.02em;margin-bottom:.4rem}
.auth-sub{color:#6c757d;font-size:.95rem;margin-bottom:1.5rem}
.card{border:1px solid #e3e6ea;border-radius:.75rem;box-shadow:0 1px 3px rgba(16,24,40,.06)}
.form-label{font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:#495057}
.form-control-lg{border-radius:.5rem}
.btn-lg{border-radius:.5rem;font-weight:600}
.auth-or{display:flex;align-items:center;gap:.75rem;margin:1.25rem 0;color:#98a2b3;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
.auth-or::before,.auth-or::after{content:"";flex:1;border-top:1px solid #e3e6ea}
.auth-alt{display:flex;flex-direction:column;gap:.5rem}
.foot{color:#6c757d;font-size:.9rem;text-align:center;margin-top:1.25rem}
.foot a{font-weight:600;text-decoration:none}
.otp-row{display:flex;gap:.5rem;justify-content:center;margin:1rem 0 1.25rem}
.otp-digit{width:48px;height:56px;text-align:center;font-size:1.5rem;font-weight:700;border:1.5px solid #d0d5dd;border-radius:.5rem}
.otp-digit:focus{border-color:#0d6efd;box-shadow:0 0 0 .2rem rgba(13,110,253,.15);outline:none}
</style>
</head>
<body>
<div class="auth-wrap"><div class="auth-box">
<h1 class="auth-title h3">Login to your account</h1>
<p class="auth-sub">No password needed. We'll email you a code.</p>
<div class="card"><div class="card-body p-4">
<form>
<div class="mb-3"><label class="form-label" for="email">Email</label><input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="you@example.com" autocomplete="username" required></div>
<button type="submit" class="btn btn-primary btn-lg w-100 mt-2"><i class="bi bi-send me-2"></i>Send me a login code</button>
<div class="auth-or">or</div>
<a class="btn btn-outline-secondary btn-lg w-100" href="login.html"><i class="bi bi-key me-2"></i>Use password instead</a>
</form>
</div></div>
<div class="foot">Don&#39;t have an account? <a href="register.html">Register</a></div>
</div></div>
</body>
</html>
